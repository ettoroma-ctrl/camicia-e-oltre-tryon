<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Camicia e Oltre - Virtual Try On</title>

<style>
html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
}

#video {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    transform: scaleX(-1);
}

#canvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 10;
}

#ui {
    position: fixed;
    z-index: 20;
    top: 25px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,.75);
    color: white;
    padding: 12px 20px;
    border-radius: 25px;
    font-family: Arial, sans-serif;
    text-align: center;
    white-space: nowrap;
}

button {
    padding: 12px 20px;
    border: 0;
    border-radius: 20px;
    font-size: 16px;
}

#status {
    margin-top: 7px;
}
</style>
</head>

<body>

<video id="video" autoplay playsinline muted></video>

<canvas id="canvas"></canvas>

<div id="ui">
    <button id="start">📷 Apri fotocamera</button>
    <div id="status">In attesa...</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js"></script>

<script>

const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const start = document.getElementById("start");
const status = document.getElementById("status");

let poseData = null;


/* =========================================
   CAMICIA
========================================= */

const shirt = new Image();

shirt.src = "camicia.png?v=10";

shirt.onload = function() {
    console.log("CAMICIA CARICATA");
};

shirt.onerror = function() {
    status.innerHTML = "❌ ERRORE: camicia.png non trovata";
};


/* =========================================
   MEDIAPIPE POSE
========================================= */

const pose = new Pose({
    locateFile: function(file) {
        return "https://cdn.jsdelivr.net/npm/@mediapipe/pose/" + file;
    }
});

pose.setOptions({
    modelComplexity: 1,
    smoothLandmarks: true,
    enableSegmentation: false,
    minDetectionConfidence: 0.5,
    minTrackingConfidence: 0.5
});


pose.onResults(function(results) {

    poseData = results.poseLandmarks || null;

    if (poseData) {
        status.innerHTML = "✅ CORPO RICONOSCIUTO";
    } else {
        status.innerHTML = "🧍 Posizionati davanti alla fotocamera";
    }

});


/* =========================================
   DIMENSIONE CANVAS
========================================= */

function resizeCanvas() {

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

}

window.addEventListener("resize", resizeCanvas);

resizeCanvas();


/* =========================================
   TRASFORMA COORDINATE MEDIAPIPE
   NEL VIDEO VISIBILE SUL TELEFONO
========================================= */

function videoPoint(index) {

    const p = poseData[index];

    if (!p) {
        return {
            x: 0,
            y: 0,
            v: 0
        };
    }

    const videoWidth = video.videoWidth;
    const videoHeight = video.videoHeight;

    const screenWidth = canvas.width;
    const screenHeight = canvas.height;

    if (!videoWidth || !videoHeight) {
        return {
            x: p.x * screenWidth,
            y: p.y * screenHeight,
            v: p.visibility || 1
        };
    }

    /*
       object-fit: cover

       Calcoliamo esattamente quanto
       viene ingrandita l'immagine della
       fotocamera sullo schermo.
    */

    const scale = Math.max(
        screenWidth / videoWidth,
        screenHeight / videoHeight
    );

    const displayedWidth = videoWidth * scale;
    const displayedHeight = videoHeight * scale;

    const cropX = (displayedWidth - screenWidth) / 2;
    const cropY = (displayedHeight - screenHeight) / 2;

    /*
       MediaPipe usa coordinate normali 0-1.
       La telecamera è specchiata, quindi
       invertiamo X.
    */

    const sourceX = (1 - p.x) * videoWidth;
    const sourceY = p.y * videoHeight;

    const screenX = sourceX * scale - cropX;
    const screenY = sourceY * scale - cropY;

    return {
        x: screenX,
        y: screenY,
        v: p.visibility || 1
    };
}


/* =========================================
   DISTANZA
========================================= */

function distance(a, b) {

    return Math.sqrt(
        Math.pow(a.x - b.x, 2) +
        Math.pow(a.y - b.y, 2)
    );

}


/* =========================================
   DISEGNO CAMICIA
========================================= */

function drawShirt() {

    if (!poseData) return;

    if (!shirt.complete) return;

    if (!shirt.naturalWidth) return;


    /*
       MediaPipe:

       11 = spalla sinistra
       12 = spalla destra
       23 = fianco sinistro
       24 = fianco destro
    */

    const leftShoulder = videoPoint(11);
    const rightShoulder = videoPoint(12);

    const leftHip = videoPoint(23);
    const rightHip = videoPoint(24);


    /*
       Controlliamo che i punti siano affidabili.
    */

    if (
        leftShoulder.v < 0.25 ||
        rightShoulder.v < 0.25 ||
        leftHip.v < 0.20 ||
        rightHip.v < 0.20
    ) {
        return;
    }


    /*
       Larghezza spalle
    */

    const shoulderWidth = distance(
        leftShoulder,
        rightShoulder
    );


    if (shoulderWidth < 60) return;


    /*
       Centro delle spalle
    */

    const centerX =
        (leftShoulder.x + rightShoulder.x) / 2;

    const centerShoulderY =
        (leftShoulder.y + rightShoulder.y) / 2;


    /*
       Centro dei fianchi
    */

    const centerHipY =
        (leftHip.y + rightHip.y) / 2;


    /*
       Inclinazione delle spalle
    */

    const angle = Math.atan2(
        rightShoulder.y - leftShoulder.y,
        rightShoulder.x - leftShoulder.x
    );


    /*
       DIMENSIONI CAMICIA

       Questi valori sono già pensati
       per una camicia reale indossata.
    */

    const shirtWidth =
        shoulderWidth * 2.10;

    const shirtHeight =
        Math.max(
            shoulderWidth * 1.70,
            centerHipY - centerShoulderY +
            shoulderWidth * 0.80
        );


    /*
       La parte superiore della camicia
       deve partire leggermente sopra
       la linea delle spalle.
    */

    const shirtTop =
        centerShoulderY -
        shoulderWidth * 0.25;


    /* =====================================
       DISEGNO
    ===================================== */

    ctx.save();


    /*
       Posizionamento sul corpo
    */

    ctx.translate(
        centerX,
        shirtTop
    );


    /*
       Rotazione in base alle spalle
    */

    ctx.rotate(angle);


    /*
       Disegniamo la camicia centrata.
    */

    ctx.globalAlpha = 1;


    ctx.drawImage(
        shirt,
        -shirtWidth / 2,
        0,
        shirtWidth,
        shirtHeight
    );


    ctx.restore();

}


/* =========================================
   RENDER CONTINUO
========================================= */

function render() {

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    drawShirt();

    requestAnimationFrame(render);

}


/* =========================================
   FOTOCAMERA
========================================= */

async function openCamera() {

    try {

        const stream =
            await navigator.mediaDevices.getUserMedia({

                video: {
                    facingMode: "user",
                    width: {
                        ideal: 1280
                    },
                    height: {
                        ideal: 720
                    }
                },

                audio: false

            });


        video.srcObject = stream;

        await video.play();


        start.style.display = "none";


        /*
           Avviamo MediaPipe
        */

        process();


    } catch (error) {

        console.error(error);

        status.innerHTML =
            "❌ Permesso fotocamera negato";

    }

}


/* =========================================
   PROCESSAMENTO POSE
========================================= */

async function process() {

    if (video.readyState >= 2) {

        try {

            await pose.send({
                image: video
            });

        } catch (error) {

            console.error(error);

        }

    }

    requestAnimationFrame(process);

}


/* =========================================
   AVVIO
========================================= */

start.addEventListener(
    "click",
    openCamera
);


render();

</script>

</body>
</html>
