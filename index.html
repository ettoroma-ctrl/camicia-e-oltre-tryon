<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Virtual Try-On</title>
<style>
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#000}
#video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
#canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#box{position:absolute;z-index:10;left:50%;top:28px;transform:translateX(-50%);background:rgba(0,0,0,.72);color:#fff;padding:12px 22px;border-radius:25px;font-family:Arial,sans-serif;text-align:center;min-width:210px}
#start{border:0;border-radius:18px;padding:10px 18px;font-size:16px}
#status{margin-top:6px;font-size:15px}
</style>
</head>
<body>
<video id="video" autoplay playsinline muted></video>
<canvas id="canvas"></canvas>
<div id="box"><button id="start">📷 Apri fotocamera</button><div id="status">In attesa...</div></div>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js"></script>
<script>
const video=document.getElementById('video');
const canvas=document.getElementById('canvas');
const ctx=canvas.getContext('2d');
const start=document.getElementById('start');
const status=document.getElementById('status');
let W=1280,H=720,landmarks=null;

const shirt=new Image();
shirt.src='camicia.png';
shirt.onload=()=>console.log('Camicia caricata');
shirt.onerror=()=>status.innerHTML='❌ Non trovo camicia.png';

const pose=new Pose({
  locateFile:file=>'https://cdn.jsdelivr.net/npm/@mediapipe/pose/'+file
});
pose.setOptions({
  modelComplexity:1,
  smoothLandmarks:true,
  enableSegmentation:false,
  minDetectionConfidence:.5,
  minTrackingConfidence:.5
});
pose.onResults(results=>{
  landmarks=results.poseLandmarks||null;
  status.innerHTML=landmarks?'✅ CORPO RICONOSCIUTO':'🧍 Corpo non riconosciuto';
});

async function startCamera(){
  try{
    const stream=await navigator.mediaDevices.getUserMedia({
      video:{facingMode:'user',width:{ideal:1280},height:{ideal:720}},
      audio:false
    });
    video.srcObject=stream;
    await video.play();
    W=video.videoWidth||1280;
    H=video.videoHeight||720;
    canvas.width=W;
    canvas.height=H;
    start.style.display='none';
    process();
  }catch(error){
    status.innerHTML='❌ Permesso fotocamera negato';
    console.error(error);
  }
}

async function process(){
  if(video.readyState>=2) await pose.send({image:video});
  requestAnimationFrame(process);
}

function p(i){
  const x=landmarks[i];
  return {x:(1-x.x)*W,y:x.y*H,v:x.visibility??1};
}

function dist(a,b){
  return Math.hypot(a.x-b.x,a.y-b.y);
}

function drawShirt(){
  if(!landmarks || !shirt.complete || !shirt.naturalWidth) return;

  const ls=p(11), rs=p(12), lh=p(23), rh=p(24);
  if(Math.min(ls.v,rs.v,lh.v,rh.v)<.35) return;

  const shoulderMid={
    x:(ls.x+rs.x)/2,
    y:(ls.y+rs.y)/2
  };

  const hipMid={
    x:(lh.x+rh.x)/2,
    y:(lh.y+rh.y)/2
  };

  const shoulderW=dist(ls,rs);
  if(shoulderW<40) return;

  const aspect=shirt.naturalHeight/shirt.naturalWidth;

  // Larghezza della camicia rispetto alle spalle.
  const targetW=shoulderW*2.05;
  const targetH=targetW*aspect;

  // La camicia parte poco sopra le spalle.
  const top=shoulderMid.y-shoulderW*.22;

  // La facciamo arrivare sotto il bacino.
  const desiredBottom=hipMid.y+shoulderW*.95;
  const finalH=Math.max(targetH,desiredBottom-top);
  const finalW=finalH/aspect;

  ctx.save();

  // Segue leggermente l'inclinazione delle spalle.
  const angle=Math.atan2(rs.y-ls.y,rs.x-ls.x);
  ctx.translate(shoulderMid.x,top);
  ctx.rotate(angle*.35);

  ctx.globalAlpha=.98;
  ctx.drawImage(
    shirt,
    -finalW/2,
    0,
    finalW,
    finalH
  );

  ctx.restore();
}

function render(){
  ctx.clearRect(0,0,W,H);
  drawShirt();
  requestAnimationFrame(render);
}

start.addEventListener('click',startCamera);
render();
</script>
</body>
</html>
