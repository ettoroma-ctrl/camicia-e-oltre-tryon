<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Camicia e Oltre - Virtual Try On</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    #app {
      width: 100vw;
      height: 100vh;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #111;
    }

    video {
      position: absolute;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
      display: none;
    }

    canvas {
      position: absolute;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
    }

    #loading {
      position: absolute;
      z-index: 10;
      background: rgba(0,0,0,.75);
      padding: 20px 28px;
      border-radius: 15px;
      font-size: 17px;
      text-align: center;
    }

    #info {
      position: absolute;
      z-index: 20;
      bottom: 25px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,.65);
      padding: 12px 20px;
      border-radius: 30px;
      font-size: 14px;
      white-space: nowrap;
    }
  </style>
</head>

<body>

<div id="app">

  <video id="video" autoplay playsinline></video>

  <canvas id="canvas"></canvas>

  <div id="loading">
    Caricamento Virtual Try On...
  </div>

  <div id="info">
    LIVE — muoviti davanti alla fotocamera
  </div>

</div>

<!-- MediaPipe -->
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js"></script>

<script>

const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const loading = document.getElementById("loading");

const shirt = new Image();

/*
  IMPORTANTE:
  il file deve chiamarsi esattamente:

  camicia.png

  e deve essere nella stessa cartella di index.html
*/
shirt.src = "./camicia.png";


let poseReady = false;


/* =========================
   CAMERA
========================= */

async function startCamera() {

  try {

    const stream = await navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: "user",
        width: {
          ideal: 1280
        },
        height: {
          ideal: 720
        }
      },
      audio: false
    });

    video.srcObject = stream;

    await video.play();

    resizeCanvas();

    loading.innerText = "Rilevamento del corpo...";

    startPose();

  } catch (error) {

    console.error(error);

    loading.innerHTML =
      "⚠️ Impossibile accedere alla fotocamera.<br><br>" +
      "Controlla i permessi della fotocamera.";

  }

}


/* =========================
   CANVAS
========================= */

function resizeCanvas() {

  canvas.width = video.videoWidth || 1280;
  canvas.height = video.videoHeight || 720;

}


/* =========================
   MEDIAPIPE POSE
========================= */

const pose = new Pose({

  locateFile: (file) => {

    return `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`;

  }

});


pose.setOptions({

  modelComplexity: 1,

  smoothLandmarks: true,

  enableSegmentation: false,

  smoothSegmentation: false,

  minDetectionConfidence: 0.5,

  minTrackingConfidence: 0.5

});


pose.onResults(onResults);


/* =========================
   AVVIO POSE
========================= */

function startPose() {

  poseReady = true;

  loading.style.display = "none";

  processFrame();

}


/* =========================
   FRAME
========================= */

async function processFrame() {

  if (!poseReady) return;

  if (video.readyState >= 2) {

    await pose.send({
      image: video
    });

  }

  requestAnimationFrame(processFrame);

}


/* =========================
   RISULTATI
========================= */

function onResults(results) {

  resizeCanvas();

  const W = canvas.width;
  const H = canvas.height;

  /*
    Disegniamo prima la persona
  */

  ctx.save();

  ctx.scale(-1, 1);

  ctx.drawImage(
    video,
    -W,
    0,
    W,
    H
  );

  ctx.restore();


  if (!results.poseLandmarks) {

    return;

  }


  const lm = results.poseLandmarks;


  /*
    LANDMARK PRINCIPALI

    11 = spalla sinistra
    12 = spalla destra

    23 = anca sinistra
    24 = anca destra

    13 = gomito sinistro
    14 = gomito destro

    15 = polso sinistro
    16 = polso destro
  */

  const leftShoulder  = lm[11];
  const rightShoulder = lm[12];

  const leftHip  = lm[23];
  const rightHip = lm[24];

  const leftElbow  = lm[13];
  const rightElbow = lm[14];

  const leftWrist  = lm[15];
  const rightWrist = lm[16];


  if (
    !leftShoulder ||
    !rightShoulder ||
    !leftHip ||
    !rightHip
  ) {

    return;

  }


  /*
    Coordinate reali.
    Il video viene specchiato.
  */

  function X(point) {
    return (1 - point.x) * W;
  }

  function Y(point) {
    return point.y * H;
  }


  const LS = {
    x: X(leftShoulder),
    y: Y(leftShoulder)
  };

  const RS = {
    x: X(rightShoulder),
    y: Y(rightShoulder)
  };

  const LH = {
    x: X(leftHip),
    y: Y(leftHip)
  };

  const RH = {
    x: X(rightHip),
    y: Y(rightHip)
  };


  /*
    Centro del busto
  */

  const centerX =
    (LS.x + RS.x + LH.x + RH.x) / 4;

  const centerY =
    (LS.y + RS.y) / 2;


  /*
    Larghezza delle spalle
  */

  const shoulderWidth = Math.sqrt(
    Math.pow(RS.x - LS.x, 2) +
    Math.pow(RS.y - LS.y, 2)
  );


  /*
    La camicia deve essere leggermente
    più larga delle spalle.
  */

  const shirtWidth =
    shoulderWidth * 1.65;


  /*
    Rapporto originale della camicia.
  */

  const shirtRatio =
    shirt.height / shirt.width;


  const shirtHeight =
    shirtWidth * shirtRatio;


  /*
    Posizione verticale.

    La camicia parte leggermente
    sopra le spalle.
  */

  const topY =
    centerY - shoulderWidth * 0.30;


  /*
    Disegno trasformato.
  */

  ctx.save();


  /*
    Centro immagine
  */

  ctx.translate(centerX, topY);


  /*
    Rotazione in base alla linea
    delle spalle.
  */

  const angle =
    Math.atan2(
      RS.y - LS.y,
      RS.x - LS.x
    );


  ctx.rotate(angle);


  /*
    Manteniamo la proporzione
    della camicia.
  */

  ctx.globalAlpha = 0.98;


  ctx.drawImage(
    shirt,
    -shirtWidth / 2,
    0,
    shirtWidth,
    shirtHeight
  );


  ctx.restore();


  /*
    Ridisegniamo le braccia sopra la camicia.

    Questo evita che la camicia rimanga
    davanti alle braccia.
  */

  redrawArm(
    leftShoulder,
    leftElbow,
    leftWrist
  );

  redrawArm(
    rightShoulder,
    rightElbow,
    rightWrist
  );

}


/* =========================
   BRACCIA
========================= */

function redrawArm(shoulder, elbow, wrist) {

  if (!shoulder || !elbow || !wrist) {
    return;
  }

  const W = canvas.width;
  const H = canvas.height;


  function X(point) {
    return (1 - point.x) * W;
  }

  function Y(point) {
    return point.y * H;
  }


  const S = {
    x: X(shoulder),
    y: Y(shoulder)
  };

  const E = {
    x: X(elbow),
    y: Y(elbow)
  };

  const Wp = {
    x: X(wrist),
    y: Y(wrist)
  };


  /*
    Larghezza approssimativa del braccio.
  */

  const upperWidth = 35;
  const lowerWidth = 28;


  function perpendicular(a, b, width) {

    const dx = b.x - a.x;
    const dy = b.y - a.y;

    const length =
      Math.sqrt(dx * dx + dy * dy) || 1;

    return {
      x: -dy / length * width,
      y: dx / length * width
    };

  }


  const p1 =
    perpendicular(S, E, upperWidth);

  const p2 =
    perpendicular(E, Wp, lowerWidth);


  /*
    Disegniamo la parte del video
    corrispondente al braccio.
  */

  ctx.save();

  ctx.beginPath();

  ctx.moveTo(
    S.x + p1.x,
    S.y + p1.y
  );

  ctx.lineTo(
    E.x + p1.x,
    E.y + p1.y
  );

  ctx.lineTo(
    Wp.x + p2.x,
    Wp.y + p2.y
  );

  ctx.lineTo(
    Wp.x - p2.x,
    Wp.y - p2.y
  );

  ctx.lineTo(
    E.x - p1.x,
    E.y - p1.y
  );

  ctx.lineTo(
    S.x - p1.x,
    S.y - p1.y
  );

  ctx.closePath();

  ctx.clip();


  /*
    Disegniamo il video originale
    solamente dentro il braccio.
  */

  ctx.scale(-1, 1);

  ctx.drawImage(
    video,
    -W,
    0,
    W,
    H
  );


  ctx.restore();

}


/* =========================
   AVVIO
========================= */

shirt.onload = () => {

  startCamera();

};

shirt.onerror = () => {

  loading.innerHTML =
    "❌ Non trovo <b>camicia.png</b>.<br><br>" +
    "Controlla che il nome del file sia esattamente:<br>" +
    "<b>camicia.png</b>";

};

</script>

</body>
</html>
