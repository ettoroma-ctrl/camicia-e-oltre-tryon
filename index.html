<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Test Body Tracking</title>

<style>
html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
}

#video{
    position:absolute;
    width:100%;
    height:100%;
    object-fit:cover;
    transform:scaleX(-1);
}

#canvas{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
}

#box{
    position:absolute;
    z-index:10;
    left:50%;
    top:30px;
    transform:translateX(-50%);
    background:rgba(0,0,0,.75);
    color:white;
    padding:12px 20px;
    border-radius:25px;
    font-family:Arial;
    text-align:center;
}
</style>
</head>

<body>

<video id="video" autoplay playsinline muted></video>

<canvas id="canvas"></canvas>

<div id="box">
    <button id="start">📷 Apri fotocamera</button>
    <div id="status"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js"></script>

<script>

const video =
document.getElementById("video");

const canvas =
document.getElementById("canvas");

const ctx =
canvas.getContext("2d");

const start =
document.getElementById("start");

const status =
document.getElementById("status");

let W=1280;
let H=720;

let landmarks=null;


/* =========================
   MEDIAPIPE
========================= */

const pose = new Pose({

    locateFile:function(file){

        return "https://cdn.jsdelivr.net/npm/@mediapipe/pose/" + file;

    }

});


pose.setOptions({

    modelComplexity:1,

    smoothLandmarks:true,

    enableSegmentation:false,

    minDetectionConfidence:.5,

    minTrackingConfidence:.5

});


pose.onResults(function(results){

    if(results.poseLandmarks){

        landmarks =
        results.poseLandmarks;

        status.innerHTML =
        "✅ CORPO RICONOSCIUTO";

    }else{

        landmarks=null;

        status.innerHTML =
        "🧍 Corpo non riconosciuto";

    }

});


/* =========================
   CAMERA
========================= */

async function startCamera(){

    try{

        const stream =
        await navigator.mediaDevices.getUserMedia({

            video:{
                facingMode:"user",
                width:{ideal:1280},
                height:{ideal:720}
            },

            audio:false

        });


        video.srcObject=stream;

        await video.play();


        W=video.videoWidth;
        H=video.videoHeight;

        canvas.width=W;
        canvas.height=H;


        start.style.display="none";


        process();

    }catch(error){

        status.innerHTML =
        "❌ "+error.name;

        console.error(error);

    }

}


/* =========================
   MEDIAPIPE LOOP
========================= */

async function process(){

    if(video.readyState>=2){

        await pose.send({
            image:video
        });

    }

    requestAnimationFrame(process);

}


/* =========================
   DISEGNO
========================= */

function render(){

    ctx.clearRect(0,0,W,H);


    /*
       Punti del corpo
    */

    if(landmarks){

        const connections=[

            [11,12],

            [11,13],
            [13,15],

            [12,14],
            [14,16],

            [11,23],
            [12,24],

            [23,24],

            [23,25],
            [25,27],

            [24,26],
            [26,28]

        ];


        /*
           LINEE
        */

        ctx.strokeStyle="lime";

        ctx.lineWidth=5;

        connections.forEach(function(pair){

            const a=
            landmarks[pair[0]];

            const b=
            landmarks[pair[1]];


            const ax=
            (1-a.x)*W;

            const ay=
            a.y*H;


            const bx=
            (1-b.x)*W;

            const by=
            b.y*H;


            ctx.beginPath();

            ctx.moveTo(ax,ay);

            ctx.lineTo(bx,by);

            ctx.stroke();

        });


        /*
           PUNTI
        */

        ctx.fillStyle="red";


        landmarks.forEach(function(p){

            if(p.visibility>.5){

                const x=
                (1-p.x)*W;

                const y=
                p.y*H;


                ctx.beginPath();

                ctx.arc(
                    x,
                    y,
                    7,
                    0,
                    Math.PI*2
                );

                ctx.fill();

            }

        });

    }


    requestAnimationFrame(render);

}


start.addEventListener(
"click",
startCamera
);


render();

</script>

</body>
</html>
