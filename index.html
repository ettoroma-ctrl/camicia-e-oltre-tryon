<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Camicia e Oltre - Virtual Try On</title>
<style>
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#000}
#video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
#canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#ui{position:absolute;z-index:20;top:25px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.75);color:#fff;padding:12px 20px;border-radius:25px;font-family:Arial;text-align:center}
button{padding:12px 20px;border:0;border-radius:20px;font-size:16px}
#status{margin-top:7px}
</style>
</head>
<body>
<video id="video" autoplay playsinline muted></video>
<canvas id="canvas"></canvas>
<div id="ui">
  <button id="start">📷 Apri fotocamera</button>
  <div id="status">In attesa...</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js"></script>
<script>
const video=document.getElementById('video');
const canvas=document.getElementById('canvas');
const ctx=canvas.getContext('2d');
const start=document.getElementById('start');
const status=document.getElementById('status');

let W=1280,H=720,poseData=null;

const shirt=new Image();
shirt.src='camicia.png?v=5';

shirt.onload=()=>{
  console.log('camicia.png caricata');
};

shirt.onerror=()=>{
  status.textContent='❌ camicia.png non trovata';
};

const pose=new Pose({
  locateFile:file=>'https://cdn.jsdelivr.net/npm/@mediapipe/pose/'+file
});

pose.setOptions({
  modelComplexity:1,
  smoothLandmarks:true,
  enableSegmentation:false,
  minDetectionConfidence:.5,
  minTrackingConfidence:.5
});

pose.onResults(results=>{
  poseData=results.poseLandmarks||null;
  status.textContent=poseData?'✅ CORPO RICONOSCIUTO':'🧍 Posizionati davanti alla fotocamera';
});

async function openCamera(){
  try{
    const stream=await navigator.mediaDevices.getUserMedia({
      video:{
        facingMode:'user',
        width:{ideal:1280},
        height:{ideal:720}
      },
      audio:false
    });

    video.srcObject=stream;
    await video.play();

    W=video.videoWidth||1280;
    H=video.videoHeight||720;

    canvas.width=W;
    canvas.height=H;

    start.style.display='none';
    process();
  }catch(e){
    status.textContent='❌ Permesso fotocamera negato';
    console.error(e);
  }
}

async function process(){
  if(video.readyState>=2){
    await pose.send({image:video});
  }
  requestAnimationFrame(process);
}

function pt(i){
  const p=poseData[i];
  return {
    x:(1-p.x)*W,
    y:p.y*H,
    v:p.visibility??1
  };
}

function distance(a,b){
  return Math.hypot(a.x-b.x,a.y-b.y);
}

function drawImageTriangle(img, sx0,sy0,sx1,sy1,sx2,sy2, dx0,dy0,dx1,dy1,dx2,dy2){
  const denom = sx0*(sy1-sy2)+sx1*(sy2-sy0)+sx2*(sy0-sy1);
  if(Math.abs(denom)<0.001) return;
  const a=(dx0*(sy1-sy2)+dx1*(sy2-sy0)+dx2*(sy0-sy1))/denom;
  const b=(dx0*(sx2-sx1)+dx1*(sx0-sx2)+dx2*(sx1-sx0))/denom;
  const c=(dx0*(sx1*sy2-sx2*sy1)+dx1*(sx2*sy0-sx0*sy2)+dx2*(sx0*sy1-sx1*sy0))/denom;
  const d=(dy0*(sy1-sy2)+dy1*(sy2-sy0)+dy2*(sy0-sy1))/denom;
  const e=(dy0*(sx2-sx1)+dy1*(sx0-sx2)+dy2*(sx1-sx0))/denom;
  const f=(dy0*(sx1*sy2-sx2*sy1)+dy1*(sx2*sy0-sx0*sy2)+dy2*(sx0*sy1-sx1*sy0))/denom;
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(dx0,dy0); ctx.lineTo(dx1,dy1); ctx.lineTo(dx2,dy2); ctx.closePath();
  ctx.clip();
  ctx.setTransform(a,b,d,e,c,f);
  ctx.drawImage(img,0,0);
  ctx.restore();
}

function drawMesh(img, q0,q1,q2,q3){
  const cols=8, rows=10, iw=img.naturalWidth, ih=img.naturalHeight;
  for(let r=0;r<rows;r++){
    const v0=r/rows, v1=(r+1)/rows;
    for(let c=0;c<cols;c++){
      const u0=c/cols, u1=(c+1)/cols;
      const bil=(u,v)=>{
        const x=(1-u)*(1-v)*q0.x + u*(1-v)*q1.x + u*v*q2.x + (1-u)*v*q3.x;
        const y=(1-u)*(1-v)*q0.y + u*(1-v)*q1.y + u*v*q2.y + (1-u)*v*q3.y;
        return {x,y};
      };
      const a=bil(u0,v0), b=bil(u1,v0), cc=bil(u1,v1), d=bil(u0,v1);
      const sx0=u0*iw, sy0=v0*ih, sx1=u1*iw, sy1=v0*ih, sx2=u1*iw, sy2=v1*ih, sx3=u0*iw, sy3=v1*ih;
      drawImageTriangle(img,sx0,sy0,sx1,sy1,sx2,sy2,a.x,a.y,b.x,b.y,cc.x,cc.y);
      drawImageTriangle(img,sx0,sy0,sx2,sy2,sx3,sy3,a.x,a.y,cc.x,cc.y,d.x,d.y);
    }
  }
}

function drawShirt(){
  if(!poseData || !shirt.complete || !shirt.naturalWidth) return;

  const ls=pt(11), rs=pt(12), lh=pt(23), rh=pt(24);
  if(Math.min(ls.v,rs.v,lh.v,rh.v)<.25) return;

  const sw=distance(ls,rs);
  if(sw<50) return;

  const shoulderCx=(ls.x+rs.x)/2;
  const shoulderCy=(ls.y+rs.y)/2;
  const hipCx=(lh.x+rh.x)/2;
  const hipCy=(lh.y+rh.y)/2;

  // Allargamento leggero oltre le spalle, ma molto meno della versione precedente.
  const shoulderScale=1.10;
  const hipScale=1.04;

  const lS={x:shoulderCx+(ls.x-shoulderCx)*shoulderScale,
            y:shoulderCy+(ls.y-shoulderCy)*shoulderScale};
  const rS={x:shoulderCx+(rs.x-shoulderCx)*shoulderScale,
            y:shoulderCy+(rs.y-shoulderCy)*shoulderScale};

  // Sposta il bordo superiore leggermente sopra le spalle per coprire il collo.
  const topLift=sw*0.10;
  lS.y-=topLift; rS.y-=topLift;

  const lH={x:hipCx+(lh.x-hipCx)*hipScale,
            y:hipCy+(lh.y-hipCy)*hipScale};
  const rH={x:hipCx+(rh.x-hipCx)*hipScale,
            y:hipCy+(rh.y-hipCy)*hipScale};

  // Bordi inferiori seguono il busto.
  lH.y+=sw*0.30; rH.y+=sw*0.30;

  // Piccolo allargamento laterale verso il basso per seguire il taglio della camicia.
  const bottomExtra=sw*0.06;
  lH.x-=bottomExtra; rH.x+=bottomExtra;

  // Quad: alto sinistra, alto destra, basso destra, basso sinistra.
  drawMesh(shirt,lS,rS,rH,lH);
}
function render(){
  ctx.clearRect(0,0,W,H);
  drawShirt();
  requestAnimationFrame(render);
}

start.addEventListener('click',openCamera);
render();
</script>
</body>
</html>
