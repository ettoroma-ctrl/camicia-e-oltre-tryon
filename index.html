<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Camicia e Oltre - Virtual Try On</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;font-family:Arial,sans-serif}
#video,#canvas{position:fixed;inset:0;width:100%;height:100%;object-fit:cover}
#video{transform:scaleX(-1)}
#canvas{pointer-events:none}
#ui{position:fixed;z-index:5;top:24px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.72);color:#fff;padding:12px 18px;border-radius:24px;text-align:center;min-width:210px}
button{border:0;border-radius:22px;padding:12px 18px;font-size:16px}
#status{margin-top:7px;font-size:15px}
</style>
</head>
<body>
<video id="video" autoplay playsinline muted></video>
<canvas id="canvas"></canvas>
<div id="ui"><button id="start">📷 Apri fotocamera</button><div id="status">In attesa...</div></div>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js"></script>
<script>
const video=document.getElementById('video'),canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d');
const start=document.getElementById('start'),status=document.getElementById('status');
const shirt=new Image(); shirt.src='camicia.png?v=20';
let landmarks=null,W=1,H=1;

const pose=new Pose({locateFile:f=>'https://cdn.jsdelivr.net/npm/@mediapipe/pose/'+f});
pose.setOptions({modelComplexity:1,smoothLandmarks:true,enableSegmentation:false,minDetectionConfidence:.55,minTrackingConfidence:.55});
pose.onResults(r=>{landmarks=r.poseLandmarks||null;status.textContent=landmarks?'✅ CORPO RICONOSCIUTO':'🧍 Inquadra spalle e busto';});

start.onclick=async()=>{
 try{
  const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:1280},height:{ideal:720}},audio:false});
  video.srcObject=stream; await video.play();
  W=video.videoWidth||1280; H=video.videoHeight||720; canvas.width=W; canvas.height=H;
  start.style.display='none'; loop();
 }catch(e){status.textContent='❌ Permesso fotocamera negato';console.error(e)}
};

function p(i){const q=landmarks[i];return q?{x:(1-q.x)*W,y:q.y*H,v:q.visibility??1}:null}
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function lerp(a,b,t){return{x:a.x+(b.x-a.x)*t,y:a.y+(b.y-a.y)*t}}

function warp(img,q0,q1,q2,q3,cols=12,rows=18){
 const iw=img.naturalWidth,ih=img.naturalHeight;
 const pt=(u,v)=>{const top=lerp(q0,q1,u),bot=lerp(q3,q2,u);return lerp(top,bot,v)};
 const tri=(sx0,sy0,sx1,sy1,sx2,sy2,d0,d1,d2)=>{
  const den=sx0*(sy1-sy2)+sx1*(sy2-sy0)+sx2*(sy0-sy1);if(Math.abs(den)<.001)return;
  const a=(d0.x*(sy1-sy2)+d1.x*(sy2-sy0)+d2.x*(sy0-sy1))/den;
  const b=(d0.x*(sx2-sx1)+d1.x*(sx0-sx2)+d2.x*(sx1-sx0))/den;
  const c=(d0.x*(sx1*sy2-sx2*sy1)+d1.x*(sx2*sy0-sx0*sy2)+d2.x*(sx0*sy1-sx1*sy0))/den;
  const d=(d0.y*(sy1-sy2)+d1.y*(sy2-sy0)+d2.y*(sy0-sy1))/den;
  const e=(d0.y*(sx2-sx1)+d1.y*(sx0-sx2)+d2.y*(sx1-sx0))/den;
  const f=(d0.y*(sx1*sy2-sx2*sy1)+d1.y*(sx2*sy0-sx0*sy2)+d2.y*(sx0*sy1-sx1*sy0))/den;
  ctx.save();ctx.beginPath();ctx.moveTo(d0.x,d0.y);ctx.lineTo(d1.x,d1.y);ctx.lineTo(d2.x,d2.y);ctx.closePath();ctx.clip();
  ctx.setTransform(a,b,d,e,c,f);ctx.drawImage(img,0,0);ctx.restore();
 };
 for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){
  const u0=c/cols,u1=(c+1)/cols,v0=r/rows,v1=(r+1)/rows;
  const A=pt(u0,v0),B=pt(u1,v0),C=pt(u1,v1),D=pt(u0,v1);
  const sx0=u0*iw,sy0=v0*ih,sx1=u1*iw,sy1=v0*ih,sx2=u1*iw,sy2=v1*ih,sx3=u0*iw,sy3=v1*ih;
  tri(sx0,sy0,sx1,sy1,sx2,sy2,A,B,C);
  tri(sx0,sy0,sx2,sy2,sx3,sy3,A,C,D);
 }
}

function drawShirt(){
 if(!landmarks||!shirt.complete||!shirt.naturalWidth)return;
 const L=p(11),R=p(12),LE=p(13),RE=p(14);
 if(!L||!R||Math.min(L.v,R.v)<.35)return;
 const sw=dist(L,R);if(sw<45)return;
 const cx=(L.x+R.x)/2,cy=(L.y+R.y)/2;
 const shoulderY=cy-sw*.10;
 const q0={x:L.x-sw*.08,y:shoulderY},q1={x:R.x+sw*.08,y:shoulderY};
 let leftBottom,rightBottom;
 if(LE&&RE&&LE.v>.25&&RE.v>.25){
   const ey=(LE.y+RE.y)/2;
   const bottomY=Math.max(ey+sw*.55,cy+sw*1.35);
   const half=sw*.72;
   leftBottom={x:cx-half,y:bottomY};rightBottom={x:cx+half,y:bottomY};
 }else{
   leftBottom={x:cx-sw*.72,y:cy+sw*1.55};
   rightBottom={x:cx+sw*.72,y:cy+sw*1.55};
 }
 warp(shirt,q0,q1,rightBottom,leftBottom,12,18);
}

function render(){ctx.clearRect(0,0,W,H);drawShirt();requestAnimationFrame(render)}
async function loop(){if(video.readyState>=2)try{await pose.send({image:video})}catch(e){}requestAnimationFrame(loop)}
render();
</script>
</body>
</html>
