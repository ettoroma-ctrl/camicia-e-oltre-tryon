<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Camicia e Oltre - Virtual Try On</title>

<style>
html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    font-family:Arial,sans-serif;
}

#video{
    position:absolute;
    width:100%;
    height:100%;
    object-fit:cover;
    transform:scaleX(-1);
}

#message{
    position:absolute;
    z-index:10;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    background:rgba(0,0,0,.8);
    color:white;
    padding:25px;
    border-radius:15px;
    text-align:center;
    max-width:85%;
}

button{
    margin-top:15px;
    padding:14px 25px;
    border:0;
    border-radius:30px;
    font-size:16px;
    cursor:pointer;
}
</style>
</head>

<body>

<video id="video" autoplay playsinline muted></video>

<div id="message">
    <div id="text">
        Premi il pulsante per aprire la fotocamera
    </div>

    <button id="start">
        📷 Apri fotocamera
    </button>
</div>


<script>

const video = document.getElementById("video");
const message = document.getElementById("message");
const text = document.getElementById("text");
const start = document.getElementById("start");


async function openCamera(){

    text.innerHTML = "Richiesta accesso alla fotocamera...";
    start.style.display = "none";


    /*
       Controlliamo che il browser supporti
       la fotocamera.
    */

    if(!navigator.mediaDevices){

        text.innerHTML =
            "❌ Questo browser non permette l'accesso alla fotocamera.<br><br>" +
            "Prova ad aprire il sito direttamente in Safari.";

        return;
    }


    if(!navigator.mediaDevices.getUserMedia){

        text.innerHTML =
            "❌ La fotocamera non è disponibile in questo browser.";

        return;
    }


    try{

        const stream =
            await navigator.mediaDevices.getUserMedia({

                video:{
                    facingMode:"user",

                    width:{
                        ideal:1280
                    },

                    height:{
                        ideal:720
                    }
                },

                audio:false

            });


        /*
           Se arriviamo qui,
           la fotocamera è autorizzata.
        */

        video.srcObject = stream;

        await video.play();


        message.style.display = "none";


        console.log(
            "CAMERA OK"
        );


    }catch(error){

        console.error(
            "ERRORE FOTOCAMERA:",
            error
        );


        start.style.display = "inline-block";


        /*
           Mostriamo l'errore REALE.
        */

        let errorText =
            error.name +
            "<br><br>" +
            (error.message || "Nessun dettaglio disponibile");


        if(error.name === "NotAllowedError"){

            errorText +=
                "<br><br>" +
                "Il browser sta bloccando l'accesso alla fotocamera. " +
                "Controlla il permesso per questo sito.";

        }


        if(error.name === "NotFoundError"){

            errorText +=
                "<br><br>" +
                "Non è stata trovata nessuna fotocamera.";

        }


        if(error.name === "NotReadableError"){

            errorText +=
                "<br><br>" +
                "La fotocamera è utilizzata da un'altra applicazione.";

        }


        if(error.name === "SecurityError"){

            errorText +=
                "<br><br>" +
                "Il browser non considera questa pagina autorizzata.";

        }


        text.innerHTML =
            "❌ Errore fotocamera<br><br>" +
            errorText;

    }

}


start.addEventListener(
    "click",
    openCamera
);

</script>

</body>
</html>
