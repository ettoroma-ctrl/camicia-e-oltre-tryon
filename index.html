<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Virtual Try-On</title>
<style>
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#000}
#video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
#canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#box{position:absolute;z-index:10;left:50%;top:28px;transform:translateX(-50%);background:rgba(0,0,0,.72);color:#fff;padding:12px 22px;border-radius:25px;font-family:Arial,sans-serif;text-align:center;min-width:210px}
#start{border:0;border-radius:18px;padding:10px 18px;font-size:16px}
#status{margin-top:6px;font-size:15px}
</style>
</head>
<body>
<video id="video" autoplay playsinline muted></video>
<canvas id="canvas"></canvas>
<div id="box"><button id="start">📷 Apri fotocamera</button><div id="status">In attesa...</div></div>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js"></script>
<script>
const video=document.getElementById('video');
const canvas=document.getElementById('canvas');
const ctx=canvas.getContext('2d');
const start=document.getElementById('start');
const status=document.getElementById('status');
let W=1280,H=720,landmarks=null;

const shirt=new Image();
shirt.src='camicia.png?v=4';
shirt.onload=()=>console.log('Camicia caricata');
shirt.onerror=()=>status.innerHTML='❌ Non trovo camicia.png';

const pose=new Pose({locateFile:file=>'https://cdn.jsdelivr.net/npm/@mediapipe/pose/'+file});
pose.setOptions({modelComplexity:1,smoothLandmarks:true,enableSegmentation:false,minDetectionConfidence:.5,minTrackingConfidence:.5});
pose.onResults(results=>{
  landmarks=results.poseLandmarks||null;
  status.innerHTML=landmarks?'✅ CORPO RICONOSCIUTO':'🧍 Corpo non riconosciuto';
});

async function startCamera(){
  try{
    const stream=await navigator.mediaDevices.getUserMedia({
      video:{facingMode:'user',width:{ideal:1280},height:{ideal:720}},
      audio:false
    });
    video.srcObject=stream;
    await video.play();
    W=video.videoWidth||1280;
    H=video.videoHeight||720;
    canvas.width=W;
    canvas.height=H;
    start.style.display='none';
    process();
  }catch(error){
    status.innerHTML='❌ Permesso fotocamera negato';
    console.error(error);
  }
}

async function process(){
  if(video.readyState>=2) await pose.send({image:video});
  requestAnimationFrame(process);
}

function p(i){
  const x=landmarks[i];
  return {x:(1-x.x)*W,y:x.y*H,v:x.visibility??1};
}
function lerp(a,b,t){
  return {x:a.x+(b.x-a.x)*t,y:a.y+(b.y-a.y)*t};
}

/* Deforma un triangolo dell'immagine della camicia
   su un triangolo corrispondente del corpo. */
function triangle(s0,s1,s2,d0,d1,d2){
  const den=(s1.y-s2.y)*(s0.x-s2.x)+(s2.x-s1.x)*(s0.y-s2.y);
  if(Math.abs(den)<0.001)return;

  const a=((d1.x-d2.x)*(s0.x-s2.x)+(d2.x-d1.x)*(s0.y-s2.y))/den;
  const b=((d1.y-d2.y)*(s0.x-s2.x)+(d2.y-d1.y)*(s0.y-s2.y))/den;
  const c=((s1.y-s2.y)*(d0.x-d2.x)+(s2.x-s1.x)*(d0.y-d2.y))/den;
  const d=((s1.y-s2.y)*(d0.y-d2.y)+(s2.x-s1.x)*(d0.x-d2.x))/den;
  const e=(s2.y*d1.x-s1.y*d2.x+(s1.x-s2.x)*d2.y+(s2.x*d1.y-s1.x*d2.y))/den;
  const f=(s2.y*d1.y-s1.y*d2.y+(s1.x-s2.x)*d2.x+(s2.x*d1.x-s1.x*d2.x))/den;

  ctx.save();
  ctx.beginPath();
  ctx.moveTo(d0.x,d0.y);
  ctx.lineTo(d1.x,d1.y);
  ctx.lineTo(d2.x,d2.y);
  ctx.closePath();
  ctx.clip();
  ctx.setTransform(a,b,c,d,e,f);
  ctx.drawImage(shirt,0,0);
  ctx.restore();
}

function drawShirt(){
  if(!landmarks||!shirt.complete||!shirt.naturalWidth)return;

  const ls=p(11),rs=p(12),lh=p(23),rh=p(24);
  if(Math.min(ls.v,rs.v,lh.v,rh.v)<.35)return;

  const sw=Math.hypot(rs.x-ls.x,rs.y-ls.y);
  if(sw<40)return;

  /* Spalle leggermente allargate */
  const shoulderL=lerp(rs,ls,.06);
  const shoulderR=lerp(ls,rs,.06);

  /* Fianchi leggermente allargati */
  const hipL=lerp(rh,lh,.08);
  const hipR=lerp(lh,rh,.08);

  /* Partenza appena sopra le spalle */
  const dy=sw*.18;
  const topL={x:shoulderL.x,y:shoulderL.y-dy};
  const topR={x:shoulderR.x,y:shoulderR.y-dy};

  /*
    Griglia elastica: la camicia viene divisa in molte celle.
    Ogni cella viene deformata separatamente seguendo il busto.
  */
  const rows=8, cols=5;
  const srcW=shirt.naturalWidth;
  const srcH=shirt.naturalHeight;
  const grid=[];

  for(let r=0;r<=rows;r++){
    const t=r/rows;
    const bodyL=lerp(topL,hipL,t);
    const bodyR=lerp(topR,hipR,t);
    const row=[];

    for(let c=0;c<=cols;c++){
      const u=c/cols;
      let pt=lerp(bodyL,bodyR,u);

      /* Leggera curvatura del davanti */
      const curve=Math.sin(Math.PI*u)*sw*.035*(1-t*.4);
      pt={x:pt.x,y:pt.y+curve};
      row.push(pt);
    }
    grid.push(row);
  }

  ctx.save();
  ctx.globalAlpha=.98;

  for(let r=0;r<rows;r++){
    for(let c=0;c<cols;c++){
      const sx0=srcW*c/cols;
      const sx1=srcW*(c+1)/cols;
      const sy0=srcH*r/rows;
      const sy1=srcH*(r+1)/rows;

      const s00={x:sx0,y:sy0};
      const s10={x:sx1,y:sy0};
      const s01={x:sx0,y:sy1};
      const s11={x:sx1,y:sy1};

      const d00=grid[r][c];
      const d10=grid[r][c+1];
      const d01=grid[r+1][c];
      const d11=grid[r+1][c+1];

      triangle(s00,s10,s11,d00,d10,d11);
      triangle(s00,s11,s01,d00,d11,d01);
    }
  }

  ctx.restore();
}

function render(){
  ctx.clearRect(0,0,W,H);
  drawShirt();
  requestAnimationFrame(render);
}

start.addEventListener('click',startCamera);
render();
</script>
</body>
</html>
