<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Camicia e Oltre - Virtual Try On</title>

<style>
html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    font-family:Arial,sans-serif;
}

#video{
    display:none;
}

#canvas{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
}

#loading{
    position:absolute;
    z-index:20;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    background:rgba(0,0,0,.75);
    color:white;
    padding:20px 28px;
    border-radius:15px;
    text-align:center;
}

#info{
    position:absolute;
    z-index:20;
    bottom:25px;
    left:50%;
    transform:translateX(-50%);
    color:white;
    background:rgba(0,0,0,.65);
    padding:12px 20px;
    border-radius:30px;
    font-size:14px;
}
</style>
</head>

<body>

<video id="video" autoplay playsinline></video>

<canvas id="canvas"></canvas>

<div id="loading">
    Caricamento Virtual Try On...
</div>

<div id="info">
    LIVE — posizionati davanti alla fotocamera
</div>


<!-- MEDIAPIPE POSE -->
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js"></script>

<script>

const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const loading = document.getElementById("loading");

const shirt = new Image();

shirt.src = "./camicia.png";

let W = 1280;
let H = 720;

let lastPose = null;


/* =========================================================
   CAMERA
========================================================= */

async function startCamera(){

    try{

        const stream = await navigator.mediaDevices.getUserMedia({
            video:{
                facingMode:"user",
                width:{ideal:1280},
                height:{ideal:720}
            },
            audio:false
        });

        video.srcObject = stream;

        await video.play();

        W = video.videoWidth;
        H = video.videoHeight;

        canvas.width = W;
        canvas.height = H;

        loading.innerHTML = "Rilevamento del corpo...";

        pose.start();

    }catch(error){

        console.error(error);

        loading.innerHTML =
            "⚠️ Permesso fotocamera negato.<br><br>" +
            "Consenti l'accesso alla fotocamera.";

    }
}


/* =========================================================
   MEDIAPIPE
========================================================= */

const pose = new Pose({
    locateFile:(file)=>{
        return "https://cdn.jsdelivr.net/npm/@mediapipe/pose/" + file;
    }
});


pose.setOptions({

    modelComplexity:2,

    smoothLandmarks:true,

    enableSegmentation:false,

    minDetectionConfidence:.55,

    minTrackingConfidence:.55

});


pose.onResults(results=>{

    if(results.poseLandmarks){

        lastPose = results.poseLandmarks;

    }

});


/* =========================================================
   UTILITY
========================================================= */

function px(p){

    return {
        x:(1-p.x)*W,
        y:p.y*H
    };

}


function distance(a,b){

    return Math.sqrt(
        Math.pow(b.x-a.x,2)+
        Math.pow(b.y-a.y,2)
    );

}


function lerp(a,b,t){

    return a+(b-a)*t;

}


/* =========================================================
   DISEGNO VIDEO
========================================================= */

function drawVideo(){

    ctx.save();

    ctx.translate(W,0);
    ctx.scale(-1,1);

    ctx.drawImage(
        video,
        0,
        0,
        W,
        H
    );

    ctx.restore();

}


/* =========================================================
   CAMICIA
========================================================= */

function drawShirt(points){

    const LS = px(points[11]);
    const RS = px(points[12]);

    const LH = px(points[23]);
    const RH = px(points[24]);


    /*
       Larghezza spalle
    */

    const shoulderWidth =
        distance(LS,RS);


    /*
       Larghezza fianchi
    */

    const hipWidth =
        distance(LH,RH);


    /*
       centro corpo
    */

    const centerTop = {
        x:(LS.x+RS.x)/2,
        y:(LS.y+RS.y)/2
    };


    const centerBottom = {
        x:(LH.x+RH.x)/2,
        y:(LH.y+RH.y)/2
    };


    /*
       AUMENTIAMO leggermente la larghezza
       per evitare l'effetto "camicia stretta".
    */

    const topWidth =
        shoulderWidth * 1.32;


    const bottomWidth =
        Math.max(
            hipWidth * 1.30,
            shoulderWidth * 1.20
        );


    /*
       Altezza busto.
    */

    const torsoHeight =
        distance(
            centerTop,
            centerBottom
        ) * 1.18;


    /*
       Angolo delle spalle.
    */

    const angle =
        Math.atan2(
            RS.y-LS.y,
            RS.x-LS.x
        );


    /*
       Vettore orizzontale.
    */

    const ux = Math.cos(angle);
    const uy = Math.sin(angle);


    /*
       Vettore verticale.
    */

    const vx = -uy;
    const vy = ux;


    /*
       Spostamento leggermente verso l'alto.
    */

    const topCenter = {

        x:centerTop.x - vx*shoulderWidth*.08,

        y:centerTop.y - vy*shoulderWidth*.08

    };


    /*
       Fondo camicia.
    */

    const bottomCenter = {

        x:topCenter.x + vx*torsoHeight,

        y:topCenter.y + vy*torsoHeight

    };


    /*
       Quattro angoli della camicia.
    */

    const TL = {

        x:topCenter.x - ux*topWidth/2,

        y:topCenter.y - uy*topWidth/2

    };


    const TR = {

        x:topCenter.x + ux*topWidth/2,

        y:topCenter.y + uy*topWidth/2

    };


    const BL = {

        x:bottomCenter.x - ux*bottomWidth/2,

        y:bottomCenter.y - uy*bottomWidth/2

    };


    const BR = {

        x:bottomCenter.x + ux*bottomWidth/2,

        y:bottomCenter.y + uy*bottomWidth/2

    };


    /*
       Usiamo una mesh composta da più fasce.
       In questo modo la camicia segue meglio
       la forma del busto.
    */

    const rows = 8;
    const cols = 4;


    for(let r=0;r<rows;r++){

        const t1=r/rows;
        const t2=(r+1)/rows;


        for(let c=0;c<cols;c++){

            const s1=c/cols;
            const s2=(c+1)/cols;


            /*
               Interpolazione bilineare.
            */

            function point(u,v){

                const topX =
                    lerp(TL.x,TR.x,u);

                const topY =
                    lerp(TL.y,TR.y,u);

                const bottomX =
                    lerp(BL.x,BR.x,u);

                const bottomY =
                    lerp(BL.y,BR.y,u);

                return {

                    x:lerp(topX,bottomX,v),

                    y:lerp(topY,bottomY,v)

                };

            }


            const p00=point(s1,t1);
            const p10=point(s2,t1);
            const p01=point(s1,t2);
            const p11=point(s2,t2);


            /*
               Coordinate sorgente della camicia.
            */

            const sx1 =
                shirt.width*s1;

            const sx2 =
                shirt.width*s2;

            const sy1 =
                shirt.height*t1;

            const sy2 =
                shirt.height*t2;


            drawTriangle(
                sx1,sy1,
                sx2,sy1,
                sx1,sy2,
                p00,p10,p01
            );


            drawTriangle(
                sx2,sy1,
                sx2,sy2,
                sx1,sy2,
                p10,p11,p01
            );

        }

    }

}


/* =========================================================
   TRIANGOLO WARP
========================================================= */

function drawTriangle(
    sx0,sy0,
    sx1,sy1,
    sx2,sy2,
    p0,p1,p2
){

    const denom =
        sx0*(sy1-sy2)+
        sx1*(sy2-sy0)+
        sx2*(sy0-sy1);


    if(Math.abs(denom)<.001)return;


    const a =
        (
            p0.x*(sy1-sy2)+
            p1.x*(sy2-sy0)+
            p2.x*(sy0-sy1)
        )/denom;


    const b =
        (
            p0.y*(sy1-sy2)+
            p1.y*(sy2-sy0)+
            p2.y*(sy0-sy1)
        )/denom;


    const c =
        (
            p0.x*(sx2-sx1)+
            p1.x*(sx0-sx2)+
            p2.x*(sx1-sx0)
        )/denom;


    const d =
        (
            p0.y*(sx2-sx1)+
            p1.y*(sx0-sx2)+
            p2.y*(sx1-sx0)
        )/denom;


    const e =
        (
            p0.x*(sx1*sy2-sx2*sy1)+
            p1.x*(sx2*sy0-sx0*sy2)+
            p2.x*(sx0*sy1-sx1*sy0)
        )/denom;


    const f =
        (
            p0.y*(sx1*sy2-sx2*sy1)+
            p1.y*(sx2*sy0-sx0*sy2)+
            p2.y*(sx0*sy1-sx1*sy0)
        )/denom;


    ctx.save();


    ctx.beginPath();

    ctx.moveTo(p0.x,p0.y);

    ctx.lineTo(p1.x,p1.y);

    ctx.lineTo(p2.x,p2.y);

    ctx.closePath();

    ctx.clip();


    ctx.setTransform(
        a,b,c,d,e,f
    );


    ctx.drawImage(
        shirt,
        0,
        0
    );


    ctx.restore();

}


/* =========================================================
   BRACCIA SOPRA LA CAMICIA
========================================================= */

function drawArm(points,a,b){

    if(!points[a] || !points[b])return;


    const A=px(points[a]);
    const B=px(points[b]);


    const width =
        Math.max(
            distance(A,B)*.30,
            25
        );


    const dx=B.x-A.x;
    const dy=B.y-A.y;

    const len=Math.sqrt(dx*dx+dy*dy)||1;


    const nx=-dy/len*width;
    const ny=dx/len*width;


    ctx.save();

    ctx.beginPath();

    ctx.moveTo(A.x+nx,A.y+ny);

    ctx.lineTo(B.x+nx*.75,B.y+ny*.75);

    ctx.lineTo(B.x-nx*.75,B.y-ny*.75);

    ctx.lineTo(A.x-nx,A.y-ny);

    ctx.closePath();

    ctx.clip();


    ctx.save();

    ctx.translate(W,0);

    ctx.scale(-1,1);

    ctx.drawImage(
        video,
        0,
        0,
        W,
        H
    );

    ctx.restore();


    ctx.restore();

}


/* =========================================================
   TESTA SOPRA LA CAMICIA
========================================================= */

function drawHead(points){

    const nose=points[0];

    if(!nose)return;


    const P=px(nose);


    const radius=W*.13;


    ctx.save();

    ctx.beginPath();

    ctx.arc(
        P.x,
        P.y,
        radius,
        0,
        Math.PI*2
    );

    ctx.clip();


    ctx.save();

    ctx.translate(W,0);

    ctx.scale(-1,1);

    ctx.drawImage(
        video,
        0,
        0,
        W,
        H
    );

    ctx.restore();


    ctx.restore();

}


/* =========================================================
   RENDER LOOP
========================================================= */

function render(){

    if(video.readyState>=2){

        ctx.setTransform(1,0,0,1,0,0);

        drawVideo();


        if(lastPose && shirt.complete){

            drawShirt(lastPose);


            /*
               Braccia sopra la camicia
            */

            drawArm(lastPose,11,13);

            drawArm(lastPose,13,15);

            drawArm(lastPose,12,14);

            drawArm(lastPose,14,16);


            /*
               Testa sopra la camicia
            */

            drawHead(lastPose);


            loading.style.display="none";

        }

    }


    requestAnimationFrame(render);

}


/* =========================================================
   START
========================================================= */

shirt.onload=()=>{

    startCamera();

    render();

};


shirt.onerror=()=>{

    loading.innerHTML=
        "❌ Non trovo camicia.png<br><br>" +
        "Controlla che sia nella stessa cartella di index.html.";

};

</script>

</body>
</html>
